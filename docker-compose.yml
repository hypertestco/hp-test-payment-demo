version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: payflow-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"

  postgres:
    image: postgres:15-alpine
    container_name: payflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
